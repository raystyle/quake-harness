name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun check
      # API 冒烟需 QUAKE_API_KEY,无 Key 时自动 skip(离线组仍全跑)
      - run: bun test
        env:
          QUAKE_API_KEY: ${{ secrets.QUAKE_API_KEY }}

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            ext: ''
            asset: quake-h-linux-x64
          - os: ubuntu-latest
            target: bun-linux-arm64
            ext: ''
            asset: quake-h-linux-arm64
          - os: ubuntu-latest
            target: bun-linux-x64-musl
            ext: ''
            asset: quake-h-linux-x64-musl
          - os: windows-latest
            target: bun-windows-x64
            ext: '.exe'
            asset: quake-h-windows-x64
          - os: windows-latest
            target: bun-windows-arm64
            ext: '.exe'
            asset: quake-h-windows-arm64
          - os: macos-latest
            target: bun-darwin-x64
            ext: ''
            asset: quake-h-darwin-x64
          - os: macos-latest
            target: bun-darwin-arm64
            ext: ''
            asset: quake-h-darwin-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build
        run: bun build --compile --minify --sourcemap --target=${{ matrix.target }} src/cli.ts --outfile dist/quake-h${{ matrix.ext }}
      - name: Smoke test binary
        if: matrix.target != 'bun-linux-arm64' && matrix.target != 'bun-linux-x64-musl' && matrix.target != 'bun-windows-arm64'
        run: dist/quake-h${{ matrix.ext }} --version && dist/quake-h${{ matrix.ext }} syntax tls
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/quake-h${{ matrix.ext }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Rename to per-platform names
        run: |
          mv dist/quake-h dist/quake-h-linux-x64 || true
          mv dist/quake-h.exe dist/quake-h-windows-x64.exe || true
      - name: Generate sha256 sidecar
        run: |
          cd dist && for f in quake-h-*; do sha256sum "$f" | awk '{print $1}' > "$f.sha256"; done && ls -la
      - name: Create release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/quake-h-*
